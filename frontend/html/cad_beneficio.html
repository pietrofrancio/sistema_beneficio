<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/cadBeneficio.js"defer></script>
    <title>Cadastrar</title>
</head>
<body>
    <header>
        <nav>
            navegador - links
        </nav>
    </header>
    <main>
        <form>
            <label for="nome">Nome do Colaborador:</label><br>
            <input type="text" id="nome"><br><br>
            <label for="cargo">Cargo do Colaborador:</label><br>
            <input type="text" id="cargo"><br><br>
            <label for="salario">Salario do Colaborador:</label><br>
            <input type="text" id="salario"><br><br>
            <label for="horas">Horas do Colaborador:</label><br>
            <input type="text" id="horas"><br><br>
            <select id="categoria">
                <option value="estagio">Estágio</option>
                <option value="pleno">Pleno</option>
                <option value="senior">Sênior</option>
            </select>
            <br><br>
            <button id="btn_cadastrar">Cadastrar</button><br><br>
        </form>
        <div id="resposta"></div>
    </main>    
</body>
</html>
